{{- if .Values.ingress.enabled }}
# Updated by Emmanuel Tobi
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-juice-shop
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-juice-shop
                port:
                  number: {{ .Values.service.port }}
{{- end }}
