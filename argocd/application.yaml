apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: juice-shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ematobi1/Tobi-devsecops-eks-pipeline.git
    # `deploy` = main + the CI image-tag bump (written by .github/workflows/ci.yml)
    targetRevision: deploy
    path: helm/juice-shop
  destination:
    server: https://kubernetes.default.svc
    namespace: juice-shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true